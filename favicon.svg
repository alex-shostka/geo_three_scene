<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <radialGradient id="globeBody" cx="38%" cy="30%" r="80%">
      <stop offset="0%"  stop-color="#4fb3f0"/>
      <stop offset="55%" stop-color="#1b6fb0"/>
      <stop offset="100%" stop-color="#08243f"/>
    </radialGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="60%" stop-color="#3bc4ff" stop-opacity="0"/>
      <stop offset="100%" stop-color="#3bc4ff" stop-opacity="0.35"/>
    </radialGradient>
    <linearGradient id="tileTop" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffd27a"/>
      <stop offset="100%" stop-color="#ffab2e"/>
    </linearGradient>
    <linearGradient id="tileLeft" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e8862a"/>
      <stop offset="100%" stop-color="#c96a15"/>
    </linearGradient>
    <linearGradient id="tileRight" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9d3d"/>
      <stop offset="100%" stop-color="#e77e1c"/>
    </linearGradient>
    <filter id="softShadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="1.2" stdDeviation="1.4" flood-color="#00121f" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Atmospheric glow -->
  <circle cx="27" cy="35" r="24" fill="url(#glow)"/>

  <!-- Globe -->
  <circle cx="27" cy="35" r="19" fill="url(#globeBody)"/>

  <!-- Latitude/longitude grid -->
  <g stroke="#bdeeff" stroke-width="0.9" fill="none" opacity="0.55">
    <ellipse cx="27" cy="35" rx="19" ry="7"/>
    <ellipse cx="27" cy="35" rx="19" ry="13.5"/>
    <ellipse cx="27" cy="35" rx="7" ry="19"/>
    <ellipse cx="27" cy="35" rx="13.5" ry="19"/>
  </g>

  <!-- Rim light -->
  <circle cx="27" cy="35" r="19" fill="none" stroke="#dff6ff" stroke-width="1.1" opacity="0.85"/>

  <!-- Glossy highlight -->
  <ellipse cx="20" cy="26" rx="8" ry="5.5" fill="#ffffff" opacity="0.22" transform="rotate(-25 20 26)"/>

  <!-- Isometric 3D tile, floating above the globe -->
  <g filter="url(#softShadow)">
    <polygon points="40,8 52,14.5 40,21 28,14.5" fill="url(#tileTop)"/>
    <polygon points="28,14.5 40,21 40,30 28,23.5" fill="url(#tileLeft)"/>
    <polygon points="52,14.5 40,21 40,30 52,23.5" fill="url(#tileRight)"/>
    <polygon points="40,8 52,14.5 40,21 28,14.5" fill="none" stroke="#8a4b09" stroke-width="0.6" opacity="0.5"/>
  </g>
</svg>
