<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GEO Three Scene</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="node_modules/cesium/Build/Cesium/Widgets/widgets.css">
</head>
<body>
  <div id="cesium-container"></div>
  <canvas id="three-canvas"></canvas>

  <button id="menu-btn" aria-label="Menu" aria-expanded="false">
    <span></span><span></span><span></span>
  </button>

  <aside id="side-panel">
    <div id="side-panel-header">
      <span id="side-panel-title">Menu</span>
    </div>
    <div id="side-panel-content">
      <ul class="settings-list">

        <li class="settings-item">
          <label class="settings-label">
            <span class="settings-text">Active tiles in scene</span>
            <input type="checkbox" id="toggle-active-tiles">
            <span class="settings-toggle"></span>
          </label>
        </li>

        <li class="settings-item settings-item--child">
          <label class="settings-label">
            <span class="settings-text">Fly to tile on click</span>
            <input type="checkbox" id="toggle-fly-to-tile" disabled>
            <span class="settings-toggle"></span>
          </label>
        </li>

        <li class="settings-item">
          <label class="settings-label">
            <span class="settings-text">Tile grid on globe</span>
            <input type="checkbox" id="toggle-tile-grid">
            <span class="settings-toggle"></span>
          </label>
        </li>

        <li class="settings-item">
          <label class="settings-label">
            <span class="settings-text">GLB tiles (3D)</span>
            <input type="checkbox" id="toggle-glb-tiles">
            <span class="settings-toggle"></span>
          </label>
        </li>

        <li class="settings-item settings-item--child">
          <label class="settings-label">
            <span class="settings-text">Enable GLB metadata</span>
            <input type="checkbox" id="toggle-glb-metadata" disabled>
            <span class="settings-toggle"></span>
          </label>
        </li>

      </ul>
    </div>
  </aside>

  <div id="tile-hud">
    <span id="hud-icon">⚠</span>
    <span id="hud-count">0</span>
    <span id="hud-label">error tiles</span>
  </div>

  <div id="tile-tooltip"></div>

  <div id="tile-card">
    <div id="tile-card-header">
      <span id="tile-card-title">Tile</span>
      <button id="tile-card-close" aria-label="Close">&times;</button>
    </div>
    <div id="tile-card-body"></div>
  </div>

  <script type="module" src="main.js"></script>
</body>
</html>
